# Configuración hyprlock - Reloj Inter + Fecha ASCII/Terminal Bold

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# CAJA DE CONTRASEÑA (Desplazada más abajo para dar espacio)
input-field {
    monitor =
    size = 270, 60
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.18)
    inner_color = rgba(15, 15, 25, 0.6)
    font_color = rgba(255, 255, 255, 0.8)
    fade_on_empty = false
    placeholder_text =
    hide_input = false
    position = 0, -230
    halign = center
    valign = center
}

# HORA
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    color = rgba(255, 255, 255, 0.9)
    font_size = 110
    font_family = Inter
    position = 0, 120
    halign = center
    valign = center
}

# MINUTOS
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = rgba(255, 255, 255, 0.9)
    font_size = 110
    font_family = Inter
    position = 0, -10
    halign = center
    valign = center
}

# DÍA DE LA SEMANA (Con Mayúscula Inicial + Fuente Terminal)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A" | sed 's/./\U&/')"
    color = rgba(255, 255, 255, 0.7)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, -105
    halign = center
    valign = center
}

# FECHA (En Negrita/Bold + Fuente Terminal)
label {
    monitor =
    text = cmd[update:1000] echo "<b>$(date +"%d %b" | sed 's/\b[a-z]/\U&/g')</b>"
    color = rgba(255, 255, 255, 0.6)
    font_size = 12
    font_family = LMMono10
    position = 0, -130
    halign = center
    valign = center
}
